<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WASM Probe</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      #status {
        margin-left: 10px;
        font-weight: bold;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 11px;
        padding: 8px;
        margin: 10px 0;
        border: 1px solid #666666;
        border-radius: 4px;
        min-height: 140px;
        user-select: text;
      }
      img {
        width: 100%;
        height: auto;
        border: 1px dashed #888888;
        background-color: #777777;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <button id="run">Run probe</button>
      <span id="status"></span>
    </div>
    <pre id="log">Click "Run probe".</pre>
    <img id="out" />
    <script src="index.js"></script>
  </body>
</html>
